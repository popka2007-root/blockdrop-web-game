name: CI

on:
  push:
    branches:
      - master
    tags:
      - "*"
  pull_request:
    branches:
      - master

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:coverage

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Verify database backup and restore
        run: npm run db:verify-backup

      - name: Install Playwright
        run: npx playwright install --with-deps chromium firefox webkit

      - name: E2E tests
        run: npm run test:e2e

      - name: Generate Linux visual baselines for failed-run diagnosis
        if: failure()
        run: npx playwright test e2e/visual.spec.js --project=chromium --update-snapshots

      - name: Upload generated Linux visual baselines
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-visual-baselines
          path: e2e/visual.spec.js-snapshots/*-linux.png
          if-no-files-found: error
          retention-days: 3

  release-validate:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release metadata
        run: npm run release:validate
