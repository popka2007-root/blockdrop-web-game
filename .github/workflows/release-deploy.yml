name: Release Deploy

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref or tag to deploy"
        required: false
        default: ""

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: blockdrop-release
  cancel-in-progress: false

jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:coverage

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Verify database backup and restore
        run: npm run db:verify-backup

      - name: Install Playwright
        run: npx playwright install --with-deps chromium firefox webkit

      - name: E2E tests
        run: npm run test:e2e

      - name: Validate release metadata
        run: npm run release:validate

  publish-release:
    needs: release-check
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: write
    timeout-minutes: 10

    steps:
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  deploy:
    needs:
      - release-check
      - publish-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      TARGET_URL: ${{ secrets.TARGET_URL }}
    if: ${{ startsWith(github.ref, 'refs/tags/') }}

    steps:
      - name: Check deployment configuration
        id: deploy-config
        run: |
          if [ -n "$VPS_HOST" ] && [ -n "$VPS_USER" ] && [ -n "$VPS_SSH_KEY" ] && [ -n "$VPS_KNOWN_HOSTS" ] && [ -n "$TARGET_URL" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Deployment secrets are incomplete; release remains published without VPS deployment."
          fi

      - name: Checkout
        if: ${{ steps.deploy-config.outputs.enabled == 'true' }}
        uses: actions/checkout@v5

      - name: Setup Node
        if: ${{ steps.deploy-config.outputs.enabled == 'true' }}
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: ${{ steps.deploy-config.outputs.enabled == 'true' }}
        run: npm ci

      - name: Install Playwright
        if: ${{ steps.deploy-config.outputs.enabled == 'true' }}
        run: npx playwright install --with-deps chromium

      - name: Configure pinned SSH identity
        if: ${{ steps.deploy-config.outputs.enabled == 'true' }}
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Deploy tagged release
        if: ${{ steps.deploy-config.outputs.enabled == 'true' }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_REF: ${{ github.ref_name }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" <<EOF
          set -e
          cd /opt/tetris
          DATA_DIR=/opt/blockdrop-data
          BACKUP_DIR="/opt/tetris_backup_\$(date +%Y%m%d_%H%M%S)"
          cp -a /opt/tetris "\$BACKUP_DIR"
          install -d -o tetris -g tetris -m 750 "\$DATA_DIR" "\$DATA_DIR/backups"
          rollback() {
            echo "Deploy failed, rolling back to \$BACKUP_DIR"
            systemctl stop tetris.service || true
            rm -rf /opt/tetris.failed
            mv /opt/tetris /opt/tetris.failed
            cp -a "\$BACKUP_DIR" /opt/tetris
            chown -R tetris:tetris /opt/tetris
            systemctl restart tetris.service
          }
          trap rollback ERR
          systemctl stop tetris.service
          if [ ! -f "\$DATA_DIR/blockdrop.sqlite" ] && [ -f /opt/tetris/blockdrop.sqlite ]; then
            cp -a /opt/tetris/blockdrop.sqlite* "\$DATA_DIR/"
          fi
          chown -R tetris:tetris "\$DATA_DIR"
          find "\$DATA_DIR" -maxdepth 1 -type f -name 'blockdrop.sqlite*' -exec chmod 600 {} \;
          git fetch origin --tags
          git checkout "$DEPLOY_REF"
          npm ci
          if [ -f "\$DATA_DIR/blockdrop.sqlite" ]; then
            BLOCKDROP_DB_FILE="\$DATA_DIR/blockdrop.sqlite" BLOCKDROP_BACKUP_DIR="\$DATA_DIR/backups" npm run db:backup
          fi
          install -m 644 deploy/blockdrop-backup.service /etc/systemd/system/blockdrop-backup.service
          install -m 644 deploy/blockdrop-backup.timer /etc/systemd/system/blockdrop-backup.timer
          install -d -m 755 /etc/systemd/system/tetris.service.d
          printf '[Service]\nEnvironment=BLOCKDROP_DB_FILE=/opt/blockdrop-data/blockdrop.sqlite\n' > /etc/systemd/system/tetris.service.d/blockdrop.conf
          systemctl daemon-reload
          git rev-parse HEAD > REVISION
          BLOCKDROP_DB_FILE=/tmp/blockdrop-verify.sqlite BLOCKDROP_DEPLOY_REASON=github-actions npm run verify
          chown -R tetris:tetris /opt/tetris
          systemctl restart tetris.service
          systemctl enable --now blockdrop-backup.timer
          curl --fail http://127.0.0.1/health/live
          curl --fail http://127.0.0.1/health/ready
          curl --fail http://127.0.0.1/metrics
          trap - ERR
          EOF

      - name: Check public health
        if: ${{ steps.deploy-config.outputs.enabled == 'true' }}
        env:
          TARGET_URL: ${{ secrets.TARGET_URL }}
          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_VERSION: ${{ github.ref_name }}
        run: npm run health:check

      - name: Run public smoke
        if: ${{ steps.deploy-config.outputs.enabled == 'true' }}
        env:
          TARGET_URL: ${{ secrets.TARGET_URL }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: npm run smoke:prod
